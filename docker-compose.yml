services:
  mysqldb:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQLDB_ROOT_PASSWORD:?Run cp .env.template .env first}
      MYSQL_USER: ${MYSQLDB_USER:?Run cp .env.template .env first}
      MYSQL_PASSWORD: ${MYSQLDB_PASSWORD:?Run cp .env.template .env first}
      MYSQL_DATABASE: ${MYSQLDB_DATABASE:?Run cp .env.template .env first}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  minio:
    image: cgr.dev/chainguard/minio@sha256:fbbc60f24cc4b293ef713d0d7c895ddf1d2ed54e6d4f9d7c1044eb840bff5a28
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run cp .env.template .env first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run cp .env.template .env first}
    command: server /data --console-address ":9001"
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  app:
    depends_on:
      mysqldb:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_JSON: >-
        {
          "spring.datasource.url": "jdbc:mysql://mysqldb:3306/${MYSQLDB_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC",
          "spring.datasource.username": "${MYSQLDB_USER}",
          "spring.datasource.password": "${MYSQLDB_PASSWORD}",
          "jwt.secret": "${JWT_SECRET:?Run cp .env.template .env first}",
          "app.storage.endpoint": "http://minio:9000",
          "app.storage.access-key": "${MINIO_ROOT_USER}",
          "app.storage.secret-key": "${MINIO_ROOT_PASSWORD}",
          "app.storage.bucket": "${STORAGE_BUCKET:-medical-card-documents}",
          "spring.data.redis.host": "redis",
          "spring.mail.host": "${MAIL_HOST:-sandbox.smtp.mailtrap.io}",
          "spring.mail.port": "${MAIL_PORT:-2525}",
          "spring.mail.username": "${MAIL_USERNAME:-}",
          "spring.mail.password": "${MAIL_PASSWORD:-}"
        }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 180s

volumes:
  mysql_data:
  minio_data:
