<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" role="img" aria-label="Entity-relationship diagram of the Medical Card schema">
  <title>Medical Card — entity-relationship diagram</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="800" fill="#ffffff"/>

  <!-- ===== connectors (drawn first, under boxes) ===== -->
  <g stroke="#334155" stroke-width="1.5" fill="none">
    <!-- User -> PatientProfile -->
    <line x1="240" y1="105" x2="420" y2="105" marker-end="url(#arrow)"/>

    <!-- User -> CareLink -->
    <polyline points="140,170 140,185 375,185 375,215" marker-end="url(#arrow)"/>

    <!-- PatientProfile -> CareLink -->
    <polyline points="460,170 460,200 285,200 285,215" marker-end="url(#arrow)"/>

    <!-- PatientProfile -> bus (real clearance below CareLink) -->
    <line x1="550" y1="170" x2="550" y2="370"/>
    <!-- horizontal bus -->
    <line x1="120" y1="370" x2="1000" y2="370"/>
    <!-- bus -> six children -->
    <line x1="120" y1="370" x2="120" y2="415" marker-end="url(#arrow)"/>
    <line x1="296" y1="370" x2="296" y2="415" marker-end="url(#arrow)"/>
    <line x1="472" y1="370" x2="472" y2="415" marker-end="url(#arrow)"/>
    <line x1="648" y1="370" x2="648" y2="415" marker-end="url(#arrow)"/>
    <line x1="824" y1="370" x2="824" y2="415" marker-end="url(#arrow)"/>
    <line x1="1000" y1="370" x2="1000" y2="415" marker-end="url(#arrow)"/>
  </g>

  <!-- ===== cardinality labels ===== -->
  <g font-family="system-ui, sans-serif" font-size="13" fill="#334155">
    <text x="252" y="97">1</text>
    <text x="393" y="97">0..1</text>
    <text x="558" y="188">0..*</text>
  </g>

  <!-- ===== helper for boxes ===== -->
  <!-- USER -->
  <g>
    <rect x="40" y="40" width="200" height="130" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="140" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">USER</text>
    <line x1="52" y1="77" x2="228" y2="77" stroke="#cbd5e1"/>
    <text x="52" y="97" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#334155">id <tspan fill="#64748b">PK</tspan></text>
    <text x="52" y="115" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#334155">email</text>
    <text x="52" y="133" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#334155">role</text>
  </g>

  <!-- PATIENT_PROFILE -->
  <g>
    <rect x="420" y="40" width="260" height="130" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="550" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">PATIENT_PROFILE</text>
    <line x1="432" y1="77" x2="668" y2="77" stroke="#cbd5e1"/>
    <text x="432" y="97" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#334155">id <tspan fill="#64748b">PK</tspan></text>
    <text x="432" y="115" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#334155">user_id <tspan fill="#64748b">FK</tspan></text>
    <text x="432" y="133" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#334155">dateOfBirth, bloodGroup</text>
  </g>

  <!-- CARE_LINK -->
  <g>
    <rect x="220" y="215" width="220" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="330" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">CARE_LINK</text>
    <line x1="232" y1="252" x2="428" y2="252" stroke="#cbd5e1"/>
    <text x="232" y="272" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#334155">id <tspan fill="#64748b">PK</tspan></text>
    <text x="232" y="290" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#334155">doctor_id, patient_id <tspan fill="#64748b">FK</tspan></text>
    <text x="232" y="308" font-family="ui-monospace, Consolas, monospace" font-size="11.5" fill="#64748b">unique (doctor, patient)</text>
  </g>

  <!-- ALLERGY -->
  <g>
    <rect x="40" y="415" width="160" height="128" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="120" y="439" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">ALLERGY</text>
    <line x1="52" y1="451" x2="188" y2="451" stroke="#cbd5e1"/>
    <text x="52" y="471" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">id <tspan fill="#64748b">PK</tspan></text>
    <text x="52" y="489" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">patient_id <tspan fill="#64748b">FK</tspan></text>
    <text x="52" y="507" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">name</text>
    <text x="52" y="525" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">severity</text>
  </g>

  <!-- CONDITION -->
  <g>
    <rect x="216" y="415" width="160" height="128" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="296" y="439" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">CONDITION</text>
    <line x1="228" y1="451" x2="364" y2="451" stroke="#cbd5e1"/>
    <text x="228" y="471" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">id <tspan fill="#64748b">PK</tspan></text>
    <text x="228" y="489" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">patient_id <tspan fill="#64748b">FK</tspan></text>
    <text x="228" y="507" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">name</text>
    <text x="228" y="525" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">status</text>
  </g>

  <!-- VISIT -->
  <g>
    <rect x="392" y="415" width="160" height="128" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="472" y="439" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">VISIT</text>
    <line x1="404" y1="451" x2="540" y2="451" stroke="#cbd5e1"/>
    <text x="404" y="471" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">id <tspan fill="#64748b">PK</tspan></text>
    <text x="404" y="489" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">patient_id <tspan fill="#64748b">FK</tspan></text>
    <text x="404" y="507" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">doctor_id <tspan fill="#64748b">FK</tspan></text>
    <text x="404" y="525" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">visitDate</text>
  </g>

  <!-- DOCUMENT -->
  <g>
    <rect x="568" y="415" width="160" height="128" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="648" y="439" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">DOCUMENT</text>
    <line x1="580" y1="451" x2="716" y2="451" stroke="#cbd5e1"/>
    <text x="580" y="471" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">id <tspan fill="#64748b">PK</tspan></text>
    <text x="580" y="489" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">patient_id <tspan fill="#64748b">FK</tspan></text>
    <text x="580" y="507" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">uploaded_by <tspan fill="#64748b">FK</tspan></text>
    <text x="580" y="525" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">documentType</text>
  </g>

  <!-- REMINDER -->
  <g>
    <rect x="744" y="415" width="160" height="128" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="824" y="439" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">REMINDER</text>
    <line x1="756" y1="451" x2="892" y2="451" stroke="#cbd5e1"/>
    <text x="756" y="471" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">id <tspan fill="#64748b">PK</tspan></text>
    <text x="756" y="489" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">patient_id <tspan fill="#64748b">FK</tspan></text>
    <text x="756" y="507" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">type</text>
    <text x="756" y="525" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">dueAt</text>
  </g>

  <!-- SHARE_LINK -->
  <g>
    <rect x="920" y="415" width="160" height="128" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="1000" y="439" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">SHARE_LINK</text>
    <line x1="932" y1="451" x2="1068" y2="451" stroke="#cbd5e1"/>
    <text x="932" y="471" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">id <tspan fill="#64748b">PK</tspan></text>
    <text x="932" y="489" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">patient_id <tspan fill="#64748b">FK</tspan></text>
    <text x="932" y="507" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">created_by <tspan fill="#64748b">FK</tspan></text>
    <text x="932" y="525" font-family="ui-monospace, Consolas, monospace" font-size="12.5" fill="#334155">token</text>
  </g>

  <!-- AUDIT_ENTRY (standalone, no lines) -->
  <g>
    <rect x="410" y="591" width="300" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="560" y="616" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">AUDIT_ENTRY</text>
    <line x1="422" y1="628" x2="698" y2="628" stroke="#cbd5e1"/>
    <text x="422" y="648" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#334155">id <tspan fill="#64748b">PK</tspan></text>
    <text x="422" y="666" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#334155">performedByEmail</text>
    <text x="422" y="684" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#334155">action, outcome</text>
    <text x="422" y="702" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#334155">timestamp</text>
    <text x="422" y="720" font-family="system-ui, sans-serif" font-size="11.5" fill="#64748b">no foreign key — standalone by design</text>
  </g>

  <text x="560" y="771" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#64748b">A row in AUDIT_ENTRY survives even if the user who triggered it is later deleted.</text>
</svg>
