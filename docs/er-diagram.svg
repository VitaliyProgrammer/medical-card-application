<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-label="Entity-relationship diagram of the Medical Card schema">
  <title>Medical Card — entity-relationship diagram</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="620" fill="#ffffff"/>

  <!-- ===== connectors (drawn first, under boxes) ===== -->
  <g stroke="#334155" stroke-width="1.5" fill="none">
    <!-- User -> PatientProfile -->
    <line x1="240" y1="95" x2="420" y2="95" marker-end="url(#arrow)"/>

    <!-- User -> CareLink -->
    <polyline points="140,150 140,165 390,165 390,195" marker-end="url(#arrow)"/>

    <!-- PatientProfile -> CareLink -->
    <polyline points="460,150 460,180 300,180 300,195" marker-end="url(#arrow)"/>

    <!-- PatientProfile -> bus -->
    <line x1="550" y1="150" x2="550" y2="230"/>
    <!-- horizontal bus -->
    <line x1="120" y1="230" x2="1000" y2="230"/>
    <!-- bus -> six children -->
    <line x1="120" y1="230" x2="120" y2="300" marker-end="url(#arrow)"/>
    <line x1="296" y1="230" x2="296" y2="300" marker-end="url(#arrow)"/>
    <line x1="472" y1="230" x2="472" y2="300" marker-end="url(#arrow)"/>
    <line x1="648" y1="230" x2="648" y2="300" marker-end="url(#arrow)"/>
    <line x1="824" y1="230" x2="824" y2="300" marker-end="url(#arrow)"/>
    <line x1="1000" y1="230" x2="1000" y2="300" marker-end="url(#arrow)"/>
  </g>

  <!-- ===== cardinality labels ===== -->
  <g font-family="system-ui, sans-serif" font-size="11" fill="#334155">
    <text x="252" y="87">1</text>
    <text x="393" y="87">0..1</text>
    <text x="112" y="292">0..*</text>
    <text x="288" y="292">0..*</text>
    <text x="464" y="292">0..*</text>
    <text x="640" y="292">0..*</text>
    <text x="816" y="292">0..*</text>
    <text x="984" y="292">0..*</text>
  </g>

  <!-- ===== helper for boxes ===== -->
  <!-- USER -->
  <g>
    <rect x="40" y="40" width="200" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="140" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">USER</text>
    <line x1="52" y1="72" x2="228" y2="72" stroke="#cbd5e1"/>
    <text x="52" y="90" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#334155">id <tspan fill="#64748b">PK</tspan></text>
    <text x="52" y="106" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#334155">email</text>
    <text x="52" y="122" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#334155">role</text>
  </g>

  <!-- PATIENT_PROFILE -->
  <g>
    <rect x="420" y="40" width="260" height="110" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="550" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">PATIENT_PROFILE</text>
    <line x1="432" y1="72" x2="668" y2="72" stroke="#cbd5e1"/>
    <text x="432" y="90" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#334155">id <tspan fill="#64748b">PK</tspan></text>
    <text x="432" y="106" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#334155">user_id <tspan fill="#64748b">FK</tspan></text>
    <text x="432" y="122" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#334155">dateOfBirth, bloodGroup</text>
  </g>

  <!-- CARE_LINK -->
  <g>
    <rect x="235" y="195" width="220" height="90" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="345" y="217" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">CARE_LINK</text>
    <line x1="247" y1="227" x2="443" y2="227" stroke="#cbd5e1"/>
    <text x="247" y="245" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#334155">id <tspan fill="#64748b">PK</tspan></text>
    <text x="247" y="261" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#334155">doctor_id, patient_id <tspan fill="#64748b">FK</tspan></text>
    <text x="247" y="277" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#64748b">unique (doctor, patient)</text>
  </g>

  <!-- ALLERGY -->
  <g>
    <rect x="40" y="300" width="160" height="112" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="120" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">ALLERGY</text>
    <line x1="52" y1="332" x2="188" y2="332" stroke="#cbd5e1"/>
    <text x="52" y="350" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">id <tspan fill="#64748b">PK</tspan></text>
    <text x="52" y="365" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">patient_id <tspan fill="#64748b">FK</tspan></text>
    <text x="52" y="380" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">name</text>
    <text x="52" y="395" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">severity</text>
  </g>

  <!-- CONDITION -->
  <g>
    <rect x="216" y="300" width="160" height="112" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="296" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">CONDITION</text>
    <line x1="228" y1="332" x2="364" y2="332" stroke="#cbd5e1"/>
    <text x="228" y="350" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">id <tspan fill="#64748b">PK</tspan></text>
    <text x="228" y="365" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">patient_id <tspan fill="#64748b">FK</tspan></text>
    <text x="228" y="380" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">name</text>
    <text x="228" y="395" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">status</text>
  </g>

  <!-- VISIT -->
  <g>
    <rect x="392" y="300" width="160" height="112" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="472" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">VISIT</text>
    <line x1="404" y1="332" x2="540" y2="332" stroke="#cbd5e1"/>
    <text x="404" y="350" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">id <tspan fill="#64748b">PK</tspan></text>
    <text x="404" y="365" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">patient_id <tspan fill="#64748b">FK</tspan></text>
    <text x="404" y="380" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">doctor_id <tspan fill="#64748b">FK</tspan></text>
    <text x="404" y="395" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">visitDate</text>
  </g>

  <!-- DOCUMENT -->
  <g>
    <rect x="568" y="300" width="160" height="112" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="648" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">DOCUMENT</text>
    <line x1="580" y1="332" x2="716" y2="332" stroke="#cbd5e1"/>
    <text x="580" y="350" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">id <tspan fill="#64748b">PK</tspan></text>
    <text x="580" y="365" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">patient_id <tspan fill="#64748b">FK</tspan></text>
    <text x="580" y="380" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">uploaded_by <tspan fill="#64748b">FK</tspan></text>
    <text x="580" y="395" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">documentType</text>
  </g>

  <!-- REMINDER -->
  <g>
    <rect x="744" y="300" width="160" height="112" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="824" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">REMINDER</text>
    <line x1="756" y1="332" x2="892" y2="332" stroke="#cbd5e1"/>
    <text x="756" y="350" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">id <tspan fill="#64748b">PK</tspan></text>
    <text x="756" y="365" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">patient_id <tspan fill="#64748b">FK</tspan></text>
    <text x="756" y="380" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">type</text>
    <text x="756" y="395" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">dueAt</text>
  </g>

  <!-- SHARE_LINK -->
  <g>
    <rect x="920" y="300" width="160" height="112" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="1000" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">SHARE_LINK</text>
    <line x1="932" y1="332" x2="1068" y2="332" stroke="#cbd5e1"/>
    <text x="932" y="350" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">id <tspan fill="#64748b">PK</tspan></text>
    <text x="932" y="365" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">patient_id <tspan fill="#64748b">FK</tspan></text>
    <text x="932" y="380" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">created_by <tspan fill="#64748b">FK</tspan></text>
    <text x="932" y="395" font-family="ui-monospace, Consolas, monospace" font-size="10.5" fill="#334155">token</text>
  </g>

  <!-- AUDIT_ENTRY (standalone, no lines) -->
  <g>
    <rect x="440" y="460" width="240" height="130" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="560" y="482" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">AUDIT_ENTRY</text>
    <line x1="452" y1="492" x2="668" y2="492" stroke="#cbd5e1"/>
    <text x="452" y="510" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#334155">id <tspan fill="#64748b">PK</tspan></text>
    <text x="452" y="526" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#334155">performedByEmail</text>
    <text x="452" y="542" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#334155">action, outcome</text>
    <text x="452" y="558" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#334155">timestamp</text>
    <text x="452" y="577" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">no foreign key — standalone by design</text>
  </g>

  <text x="560" y="612" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">A row in AUDIT_ENTRY survives even if the user who triggered it is later deleted.</text>
</svg>
