spring.application.name=medicalCard
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medical_card_application}
spring.datasource.username=${DB_USERNAME:medcard_user}
spring.datasource.password=${DB_PASSWORD:medcard_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

jwt.secret=${JWT_SECRET:dev-only-change-me-medcard-secret-key-12345}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

app.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
app.storage.region=${STORAGE_REGION:us-east-1}
app.storage.access-key=${STORAGE_ACCESS_KEY:medcard_storage}
app.storage.secret-key=${STORAGE_SECRET_KEY:medcard_storage_pass}
app.storage.bucket=${STORAGE_BUCKET:medical-card-documents}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.reminders.scan-cron=${REMINDERS_SCAN_CRON:0 */5 * * * *}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=30000
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

springdoc.swagger-ui.path=/swagger-ui.html

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n
