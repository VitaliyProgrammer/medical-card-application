databaseChangeLog:
  - changeSet:
      id: create-audit-entries-table
      author: vitaliy
      changes:
        - createTable:
            tableName: audit_entries
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: performed_by_email
                  type: VARCHAR(255)
              - column:
                  name: action
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
              - column:
                  name: method_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: target_id
                  type: BIGINT
              - column:
                  name: outcome
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: timestamp
                  type: DATETIME
                  constraints:
                    nullable: false
