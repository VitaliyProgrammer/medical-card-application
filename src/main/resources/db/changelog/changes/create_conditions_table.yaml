databaseChangeLog:
  - changeSet:
      id: create-conditions-table
      author: vitaliy
      changes:
        - createTable:
            tableName: conditions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: patient_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: diagnosed_at
                  type: DATE
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: conditions
            baseColumnNames: patient_id
            referencedTableName: patient_profiles
            referencedColumnNames: id
            onDelete: CASCADE
            constraintName: fk_conditions_patient
