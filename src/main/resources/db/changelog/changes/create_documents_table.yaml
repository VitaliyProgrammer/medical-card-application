databaseChangeLog:
  - changeSet:
      id: create-documents-table
      author: vitaliy
      changes:
        - createTable:
            tableName: documents
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: patient_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: uploaded_by
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: document_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: original_file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: stored_file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: content_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: file_size
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: uploaded_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: documents
            baseColumnNames: patient_id
            referencedTableName: patient_profiles
            referencedColumnNames: id
            onDelete: CASCADE
            constraintName: fk_documents_patient
        - addForeignKeyConstraint:
            baseTableName: documents
            baseColumnNames: uploaded_by
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
            constraintName: fk_documents_uploaded_by
