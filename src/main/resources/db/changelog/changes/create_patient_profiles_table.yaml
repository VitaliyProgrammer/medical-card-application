databaseChangeLog:
  - changeSet:
      id: create-patient-profiles-table
      author: vitaliy
      changes:
        - createTable:
            tableName: patient_profiles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: date_of_birth
                  type: DATE
              - column:
                  name: blood_group
                  type: VARCHAR(10)
              - column:
                  name: emergency_contact_name
                  type: VARCHAR(255)
              - column:
                  name: emergency_contact_phone
                  type: VARCHAR(30)
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: patient_profiles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
            constraintName: fk_patient_profiles_user
