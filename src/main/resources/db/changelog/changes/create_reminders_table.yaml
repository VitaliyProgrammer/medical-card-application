databaseChangeLog:
  - changeSet:
      id: create-reminders-table
      author: vitaliy
      changes:
        - createTable:
            tableName: reminders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: patient_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: due_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: notified
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: reminders
            baseColumnNames: patient_id
            referencedTableName: patient_profiles
            referencedColumnNames: id
            onDelete: CASCADE
            constraintName: fk_reminders_patient
